services:
  website:
    image: "ghcr.io/geraldf/ngweb:latest"
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      MEDIA_DATA_DIR: /app/data/media
      WEB_DIST_DIR: /app/apps/web/dist
      CLIENT_ORIGIN: "${CLIENT_ORIGIN:-http://localhost}"
    volumes:
      - media_data:/app/data/media
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  media_data:
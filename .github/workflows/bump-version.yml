name: Bump version after merge

on:
  pull_request_target:
    types: [closed]
    branches: [main]

concurrency:
  group: bump-version-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bump-version:
    name: Bump patch version and create tag
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Increment patch version
        run: node scripts/bump-version.mjs

      - name: Commit version and create tag
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json apps/api/package.json apps/web/package.json
          git commit -m "chore(release): bump version to ${VERSION}"
          git tag -a "v${VERSION}" -m "Version ${VERSION}" -m "Created after merge ${MERGE_SHA}."
          git push --atomic origin HEAD:main "v${VERSION}"
